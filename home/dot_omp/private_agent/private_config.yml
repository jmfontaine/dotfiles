# Claude Max 20x + ChatGPT Pro Lite. Behavior notes: omp 18.x, Nov 2026.
#
# Profile: quality-first, no manual escalation. Opus 5.5 at high drives the
# main loop; effort is set once per role and never needs a per-turn decision.

setupVersion: 3

symbolPreset: nerd

composer:
  shape: box

theme:
  dark: dark-monokai

tools:
  approvalMode: yolo # auto-approve every tier, shell and out-of-workspace writes included

# Agents never change 1Password: they say what to change and the user does it. A guard
# against mistakes, not containment: it covers the bash tool only, not shells started
# from eval.
bash:
  patterns:
    - match: "op item create*"
      approval: deny
    - match: "op item edit*"
      approval: deny
    - match: "op item delete*"
      approval: deny
    - match: "op document create*"
      approval: deny
    - match: "op document edit*"
      approval: deny
    - match: "op document delete*"
      approval: deny
    - match: "op vault create*"
      approval: deny
    - match: "op vault edit*"
      approval: deny
    - match: "op vault delete*"
      approval: deny
    - match: "op service-account create*"
      approval: deny

# omp's `commit` helper signs through the user's SSH agent, not the agent signing key
# AGENTS.md requires, and its prompt tells agents never to run `git commit`.
commit:
  enabled: false

# Opus has a 1M window, so the default trigger (window less a 15% reserve) rarely
# fires: interactive sessions ran past 500K tokens without compacting, re-reading that
# cache on every turn. Compact at a fixed 400K, and compact an idle session above 150K
# so a return after a break doesn't re-send it cold. worker.yml sets 300K for workers.
compaction:
  modelThresholds:
    "anthropic/claude-opus-5-5": "f400000"
  idleEnabled: true
  idleThresholdTokens: 150000

# Applies to roles with no explicit suffix, on models that support effort.
# Every role below pins its effort explicitly; this is the catch-all.
defaultThinkingLevel: high

advisor:
  enabled: false

memory:
  backend: local

# No automatic tool-issue reports: they are model-written and can quote
# workspace content, and `granted` pushes them to qa.omp.sh.
dev:
  autoqaConsent: denied

# `server-side-fallback-2026-06-01` beta. omp sends it only for direct-Anthropic
# Fable/Mythos requests: on a safety-classifier block Anthropic may retry
# server-side with claude-opus-5 instead of the request hard-failing.
# Relevant because `plan` and `slow` are Fable 5.2. Sonnet 5.5 supports the beta
# too, but omp doesn't send it there, so `task` and `vision` are unaffected.
providers:
  anthropic:
    serverSideFallback: true

# Spend a saved rate-limit reset automatically once an account has been blocked for an
# hour (`minBlockedMinutes`, default 60), so unattended overnight runs don't stall, and
# saved resets don't expire unused. Fable has its own key: `plan` and `slow` run on it.
# Quoted: bare `yes` is a YAML 1.1 boolean.
codexResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
claudeResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
  autoRedeemFable: "yes"

# Reviews come from another model family than the Opus author: GPT-6.1 Sol shares fewer
# of its blind spots and bills to the ChatGPT quota. Fable takes over once that quota
# runs out. worker.yml keeps its own chain for unattended workers.
task:
  agentModelOverrides:
    reviewer: "openai-codex/gpt-6.1-sol:xhigh, anthropic/claude-fable-5-2:xhigh"

modelRoles:
  # Opus 5.5: newer and cheaper than Opus 5 ($4/$20 vs $5/$25 per MTok).
  # High effort so hard turns get depth without `ultrathink`; adaptive
  # thinking keeps easy turns short. Shares the general `anthropic:7d`
  # bucket with plan/task; only Fable has its own weekly-scoped cap
  # (`anthropic:7d:fable`).
  default: anthropic/claude-opus-5-5:high

  # Fable 5.2 plans: Anthropic reports good results with it as planner and
  # orchestrator. Low-volume, so it fits the separate weekly Fable cap and
  # keeps planning off the general bucket. `high` is where Fable 5.2 gets most
  # of its gain; above it, gains are uneven.
  plan: anthropic/claude-fable-5-2:high

  # Escalation should differ in model, not just in effort: Opus 5.5 at :max
  # shares its blind spots — and its quota bucket — with the default role.
  # Fable 5.2 is the higher-tier line (2.5x Opus 5.5 list price) and bills
  # to the separate weekly Fable cap, so escalating never starves the main
  # loop. The bundled `reviewer` agent (`model: @slow`) is overridden above.
  # xhigh, not max: Anthropic positions max for open-ended science and math,
  # at many more tokens than xhigh. At xhigh Fable 5.2 may start subagents to
  # review its own work; drop to high if that drains the Fable cap.
  # Mythos 5.2 is limited to organizations in Anthropic's verification
  # programs, so not an option here.
  slow: anthropic/claude-fable-5-2:xhigh

  # Subagent fan-out multiplies across parallel workers, so Sonnet rather
  # than Opus, at the same effort as the main loop that dispatches it.
  # Sonnet 5.5: same $2/$10 as Sonnet 5, half-price cache reads. Its effort
  # levels are recalibrated (Anthropic suggests medium for well-specified
  # agentic work); high kept to avoid per-task escalation decisions.
  # Note: Sonnet 5.5, Fable and Mythos reject forced tool choice (omp
  # downgrades to `auto`), so schema-bound `completion(model=...)` on
  # "task", "plan" or "slow" can answer in prose and fail structured-output
  # validation.
  task: anthropic/claude-sonnet-5-5:high

  # Haiku 5.5: $0.10/$0.50 (vs Haiku 4.5's $1/$5), adaptive thinking with
  # effort low..max (no `minimal`). `smol` also backs the bundled `scout` and
  # `sonic` agents, memory consolidation and job widgets, not only titles.
  # Medium for smol: under omp's long agent prompt, Haiku 5.5 at low stops
  # early and skips searches and checks; medium roughly halves early stops.
  # commit and tiny stay low: short single-shot requests. 100K context in
  # omp's catalog; no server-side refusal fallback.
  smol: anthropic/claude-haiku-5-5:medium
  commit: anthropic/claude-haiku-5-5:low
  tiny: anthropic/claude-haiku-5-5:low

  vision: anthropic/claude-sonnet-5-5:medium

  # Cross-vendor by design: a Claude advisor shares blind spots with a
  # Claude default, which is the correlated-failure case a watchdog exists
  # to catch. GPT-6.1 Sol: near GPT-6 Astra at $2/$10.
  advisor: openai-codex/gpt-6.1-sol:high

retry:
  modelFallback: true
  fallbackChains:
    # Fire on ordinary 429s and provider errors, not only quota exhaustion.
    # Fallbacks keep the primary's effort. GPT-6 has no Terra tier, so
    # 6.1 Sol covers both the old Sol and Terra slots; Astra ($10/$50)
    # matches Fable's tier for `slow`.
    default:
      - openai-codex/gpt-6.1-sol:high
      - anthropic/claude-sonnet-5-5:high
    plan:
      - openai-codex/gpt-6.1-sol:xhigh
    slow:
      - openai-codex/gpt-6-astra:xhigh
    task:
      - openai-codex/gpt-6.1-sol:high
      - anthropic/claude-haiku-5-5:high
    smol:
      - openai-codex/gpt-6-luna:medium
    commit:
      - openai-codex/gpt-6-luna:low
    tiny:
      - openai-codex/gpt-6-luna:low
    vision:
      - openai-codex/gpt-6.1-sol:medium
    # Overnight cover when ChatGPT quota runs out. Works only because
    # models.yml disables Sol's native compaction (see note there).
    advisor:
      - anthropic/claude-sonnet-5-5:high

update:
  auto: false
